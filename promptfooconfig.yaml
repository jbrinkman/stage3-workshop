# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Evaluation Driven Development demonstration with promptfoo

# Define prompts to test - the skill prompt under development (TDD)
prompts:
  - "file://review-pr-comments-prompt.md"

# External evaluation script for custom deterministic evaluations
# This script contains custom assertion functions used in tests
defaultTest:
  options:
    # ========================================
    # RUBRIC GRADER — NODE.JS (Cross-platform)
    # ========================================
    # Combined scripts auto-detect mode: provider vs grader
    # Grader mode: prompt is JSON array [{role, content}, ...]
    # Provider mode: prompt is plain text
    # SPECIFY the Provider by the Label from the providers section.
    #
    # Devin CLI grader — ACTIVE
    # provider: 'Devin SWE-1.6'
    #
    # Kiro CLI grader
    provider: 'Kiro Sonnet'

providers:
  # ========================================
  # NODE.JS VERSIONS (Cross-platform)
  # ========================================
  # Combined scripts auto-detect mode: provider vs grader
  # Grader mode: prompt is JSON array [{role, content}, ...]
  # Provider mode: prompt is plain text
  #
  # Devin CLI provider
  # - id: 'exec: node ./devin.js'
  #   label: 'Devin SWE-1.6'
  #   config:
  #     model: 'SWE-1.6'

  # Kiro CLI provider
  - id: 'exec: node ./kiro.js'
    label: 'Kiro Sonnet'
    config:
      model: 'claude-sonnet-4.6'

# Test cases live in a separate suite file.
# Path is relative to this config file.
tests: file://review-comments-tests.yaml

# Output configuration
outputPath: results.html