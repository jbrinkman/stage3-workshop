# review-comments-tests.yaml
#
# Test suite loaded by promptfooconfig.yaml via `tests: file://review-comments-tests.yaml`.
#
# Philosophy: heavily weighted to DETERMINISTIC checks (parse the JSON output
# contract and verify structure + per-comment classification). Rubrics fill only
# the gaps deterministic checks can't cover (semantic reasoning quality).
#
# The skill emits human-readable prose PLUS a machine-readable summary block:
#   ```disposition
#   comment-1: FIX
#   ...
#   ```
# with each verdict in FIX | OPTIONAL | OUT_OF_SCOPE | REJECT | DEPENDENT.

- description: 'math-app fixture — classify each review comment disposition'
  vars:
    code: file://fixtures/math-app/pr-under-review.md
    comments: file://fixtures/math-app/comments.md
    expected:
      comment-1: FIX
      comment-2: FIX
      comment-3: FIX
      comment-4: OPTIONAL
      comment-5: OUT_OF_SCOPE
      comment-6: REJECT
      comment-7: DEPENDENT
      comment-8: PARTIAL
      comment-9: REJECT
  assert:
    # ---- Deterministic: structure of the hybrid output contract ----
    - type: javascript
      value: file://eval-review-comments.js:hasDispositionBlock
      metric: has-disposition-block
    - type: javascript
      value: file://eval-review-comments.js:hasAllCommentIds
      metric: all-ids-present
    - type: javascript
      value: file://eval-review-comments.js:noExtraCommentIds
      metric: no-extra-ids
    - type: javascript
      value: file://eval-review-comments.js:allDispositionsValid
      metric: dispositions-valid-enum

    # ---- Deterministic: per-comment classification vs ground truth ----
    - type: javascript
      value: file://eval-review-comments.js:classifyComment1
      metric: comment-1-FIX
    - type: javascript
      value: file://eval-review-comments.js:classifyComment2
      metric: comment-2-FIX
    - type: javascript
      value: file://eval-review-comments.js:classifyComment3
      metric: comment-3-FIX
    - type: javascript
      value: file://eval-review-comments.js:classifyComment4
      metric: comment-4-OPTIONAL
    - type: javascript
      value: file://eval-review-comments.js:classifyComment5
      metric: comment-5-OUT_OF_SCOPE
    - type: javascript
      value: file://eval-review-comments.js:classifyComment6
      metric: comment-6-REJECT
    - type: javascript
      value: file://eval-review-comments.js:classifyComment7
      metric: comment-7-DEPENDENT
    - type: javascript
      value: file://eval-review-comments.js:classifyComment8
      metric: comment-8-PARTIAL
    - type: javascript
      value: file://eval-review-comments.js:classifyComment9
      metric: comment-9-REJECT

    # ---- Rubric: semantic gaps deterministic checks can't cover ----
    # GATED: fail automatically unless the machine-readable disposition block is
    # present AND classifies this comment correctly — the reasoning is only
    # graded once the structural contract is met.
    # WHY comment-6 is rejected: the reasoning must show subtract(5,2)=3 is correct.
    - type: llm-rubric
      value: >-
        First check the machine-readable disposition block at the end of the
        response. If there is no fenced ```disposition``` block, or it does not
        contain the line "comment-6: REJECT", score 0 and stop. Otherwise, score
        based on whether the prose justification for comment-6 correctly explains
        that subtract(5, 2) returning 3 is the intended behavior, so the
        reviewer's "operand order is backwards" claim is wrong.
      metric: comment-6-reason-correct
      threshold: 0.7
    # WHY comment-7 is dependent: reasoning must name the bug fixes as prerequisites.
    - type: llm-rubric
      value: >-
        First check the machine-readable disposition block at the end of the
        response. If there is no fenced ```disposition``` block, or it does not
        contain the line "comment-7: DEPENDENT", score 0 and stop. Otherwise,
        score based on whether the prose justification for comment-7 explains
        that the regression tests depend on the divide-by-zero and power bugs
        (comment-1 / comment-2) being fixed first.
      metric: comment-7-reason-dependency
      threshold: 0.7
    # WHY comment-8 is partial: valid precision concern, but BigInt rewrite is the wrong remedy.
    - type: llm-rubric
      value: >-
        First check the machine-readable disposition block at the end of the
        response. If there is no fenced ```disposition``` block, or it does not
        contain the line "comment-8: PARTIAL", score 0 and stop. Otherwise, score
        based on whether the prose acknowledges the precision concern is
        legitimate BUT explains that rewriting the whole module in BigInt is an
        overreaching/wrong remedy for a simple calculator (i.e. valid concern,
        wrong fix).
      metric: comment-8-reason-partial
      threshold: 0.7
    # WHY comment-9 is reject: the default throw already exists in calculate().
    - type: llm-rubric
      value: >-
        First check the machine-readable disposition block at the end of the
        response. If there is no fenced ```disposition``` block, or it does not
        contain the line "comment-9: REJECT", score 0 and stop. Otherwise, score
        based on whether the prose explains that calculate() ALREADY has a
        default branch that throws on an unknown operation, so the requested
        change is already handled and no change is needed.
      metric: comment-9-reason-already-handled
      threshold: 0.7

- description: 'text-utils fixture — classify each review comment disposition'
  vars:
    code: file://fixtures/text-utils/pr-under-review.md
    comments: file://fixtures/text-utils/comments.md
    expected:
      comment-1: FIX
      comment-2: OUT_OF_SCOPE
      comment-3: REJECT
      comment-4: PARTIAL
      comment-5: OUT_OF_SCOPE
      comment-6: OPTIONAL
      comment-7: DEPENDENT
      comment-8: FIX
  assert:
    # ---- Deterministic: structure ----
    - type: javascript
      value: file://eval-review-comments.js:hasDispositionBlock
      metric: t2-has-disposition-block
    - type: javascript
      value: file://eval-review-comments.js:hasAllCommentIds
      metric: t2-all-ids-present
    - type: javascript
      value: file://eval-review-comments.js:noExtraCommentIds
      metric: t2-no-extra-ids
    - type: javascript
      value: file://eval-review-comments.js:allDispositionsValid
      metric: t2-dispositions-valid-enum

    # ---- Deterministic: per-comment classification ----
    - type: javascript
      value: file://eval-review-comments.js:classifyComment1
      metric: t2-comment-1-FIX
    - type: javascript
      value: file://eval-review-comments.js:classifyComment2
      metric: t2-comment-2-OUT_OF_SCOPE
    - type: javascript
      value: file://eval-review-comments.js:classifyComment3
      metric: t2-comment-3-REJECT
    - type: javascript
      value: file://eval-review-comments.js:classifyComment4
      metric: t2-comment-4-PARTIAL
    - type: javascript
      value: file://eval-review-comments.js:classifyComment5
      metric: t2-comment-5-OUT_OF_SCOPE
    - type: javascript
      value: file://eval-review-comments.js:classifyComment6
      metric: t2-comment-6-OPTIONAL
    - type: javascript
      value: file://eval-review-comments.js:classifyComment7
      metric: t2-comment-7-DEPENDENT
    - type: javascript
      value: file://eval-review-comments.js:classifyComment8
      metric: t2-comment-8-FIX

    # ---- Rubric (gated): semantic reasoning for the hard calls ----
    # comment-3 REJECT: wordCount already guards empty string, so the "throws" claim is wrong.
    - type: llm-rubric
      value: >-
        First check the machine-readable disposition block. If there is no fenced
        ```disposition``` block, or it does not contain "comment-3: REJECT", score
        0 and stop. Otherwise, score on whether the prose explains that wordCount
        ALREADY guards the empty-string case (returns 0 via the `str.trim() === ''`
        check), so the reviewer's claim that it throws is incorrect.
      metric: t2-comment-3-reason-correct
      threshold: 0.7
    # comment-4 PARTIAL: locale-aware concern is valid, full Intl library is overreaching.
    - type: llm-rubric
      value: >-
        First check the machine-readable disposition block. If there is no fenced
        ```disposition``` block, or it does not contain "comment-4: PARTIAL", score
        0 and stop. Otherwise, score on whether the prose acknowledges the
        edge-case concern (e.g. internal caps like McDonald) is legitimate BUT
        explains that replacing the helper with a full Intl locale-aware
        title-casing library is an overreaching remedy (valid concern, wrong-sized fix).
      metric: t2-comment-4-reason-partial
      threshold: 0.7
