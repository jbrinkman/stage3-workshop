version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  eval:
    desc: Run all promptfoo evaluations (always --no-cache; scripts/prompt live in external files)
    cmds:
      - "npx promptfoo eval --no-cache --config promptfooconfig.yaml"

  metrics:
    desc: 'Run evals and print a compact metrics table (per-named-metric + overall pass rate) to paste into ITERATION_LOG.md'
    cmds:
      - "mkdir -p tmp"
      - "npx promptfoo eval --no-cache --config promptfooconfig.yaml --output tmp/metrics.json"
      - "node scripts/summarize.js tmp/metrics.json"
      - "rm -f tmp/metrics.json"

  view:
    desc: Open the Promptfoo dashboard with all evaluation history
    cmds:
      - "npx promptfoo view"

  view:last:
    desc: Open the latest evaluation results in the default browser
    cmds:
      - "open results.html"

  clean:
    desc: Remove evaluation artifacts
    cmds:
      - "rm -f results.html results.json results.csv"
